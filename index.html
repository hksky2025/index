<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>里數軍師 - 信用卡極限分析 (你的14張卡)</title>
    <style>
        :root {
            --miles-blue: #004a99; --cash-red: #d91d2b; --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #fff; --shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif; background: var(--bg); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 420px; margin: 0 auto; background: var(--card-bg); border-radius: 25px; box-shadow: var(--shadow); overflow: hidden; }
        header { background: linear-gradient(135deg, var(--miles-blue), var(--cash-red)); color: white; padding: 30px 25px; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 5px; } .subtitle { font-size: 14px; opacity: 0.9; }
        .form-group { padding: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #555; }
        input { width: 100%; padding: 15px; border: 2px solid #e9ecef; border-radius: 12px; font-size: 16px; transition: all 0.3s; }
        input:focus { border-color: var(--miles-blue); outline: none; box-shadow: 0 0 0 3px rgba(0,74,153,0.1); }
        .toggle-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .toggle-btn { flex: 1; padding: 12px; border: 2px solid #ddd; background: white; border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .toggle-btn.active { background: var(--miles-blue); color: white; border-color: var(--miles-blue); }
        .analyze-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, var(--miles-blue), var(--cash-red)); color: white; border: none; border-radius: 15px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: transform 0.2s; }
        .analyze-btn:hover { transform: scale(1.02); }
        .results { padding: 25px; display: none; animation: slideIn 0.4s; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .miles-title { color: var(--miles-blue); } .cash-title { color: var(--cash-red); margin-top: 30px; }
        .card-box { background: #f8f9ff; border: 2px solid #e3f2fd; border-radius: 15px; padding: 20px; margin-bottom: 15px; position: relative; transition: all 0.3s; }
        .card-box.cash { background: #fff5f5; border-color: #ffebee; }
        .card-name { font-size: 18px; font-weight: 700; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
        .card-rate { font-size: 22px; font-weight: 800; color: var(--miles-blue); }
        .card-cash-rate { color: var(--cash-red); }
        .detail { font-size: 14px; color: #666; margin: 8px 0; line-height: 1.4; }
        .burst-btn { position: absolute; top: 15px; right: 15px; background: #ff4444; color: white; border: none; padding: 8px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .burst-btn:hover { background: #cc0000; } .exhausted { opacity: 0.5; background: #f0f0f0 !important; }
        .tips { background: #e8f5e8; border: 1px solid #c3e6c3; border-radius: 10px; padding: 15px; margin-top: 20px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>✈️ 里數軍師</h1>
            <p class="subtitle">你的14張卡 • 極限回贈分析 • 2026最新</p>
        </header>

        <div class="form-group">
            <label>商戶/類別</label>
            <input type="text" id="merchant" placeholder="Apple, Trip.com, 食飯, 巴士...">
            <label>金額 (HKD)</label>
            <input type="number" id="amount" placeholder="10000" value="10000">
            <label>類型</label>
            <div class="toggle-group">
                <div class="toggle-btn active" onclick="setType('HKD',this)">港幣</div>
                <div class="toggle-btn" onclick="setType('FOREIGN',this)">外幣</div>
            </div>
            <label>支付</label>
            <div class="toggle-group">
                <div class="toggle-btn active" onclick="setPay('Online',this)">網上</div>
                <div class="toggle-btn" onclick="setPay('ApplePay',this)">Apple Pay</div>
                <div class="toggle-btn" onclick="setPay('Store',this)">實體</div>
            </div>
            <button class="analyze-btn" onclick="analyze()">🚀 分析最抵卡</button>
        </div>

        <div id="results" class="results">
            <div class="section-title miles-title">🌟 里數優先 (首選)</div>
            <div id="miles"></div>
            <div class="section-title cash-title">💰 回贈次選</div>
            <div id="cash"></div>
            <div class="tips">💡 里數估值 $0.05/里 | 爆額後自動輪換 | 數據來源銀行2026 promo</div>
        </div>
    </div>

    <script>
        let type = 'HKD', pay = 'Online', exhausted = [];
        const cards = [ // 全14張準數據
            {id:'everymile',name:'HSBC EveryMile',type:'miles',score:50,rate:'$2/里 (外幣)',desc:'海外 $2/里，Trip.com $5/里',cond:'外幣高'},
            {id:'scmiles',name:'SC Miles',type:'miles',score:40,rate:'$4/里',desc:'網購/餐飲強',cond:''},
            {id:'vs',name:'HSBC Visa Signature',type:'miles',score:36,rate:'$2.78/里',desc:'賞享受 Trip.com OK',cond:'分配賞'},
            {id:'mox',name:'Mox',type:'miles',score:25,rate:'$4/里',desc:'里數模式無上限',cond:''},
            {id:'eye',name:'CCB Eye',type:'miles',score:10,rate:'$10/里',desc:'網購 promo',cond:''},
            {id:'dbblack',name:'DBS Black',type:'miles',score:8,rate:'$6/里',desc:'基本轉 Asia Miles',cond:''},
            {id:'mmpower',name:'HASE MMPOWER',type:'cash',score:54,rate:'5.4%',desc:'網購5%，外幣~4% (月滿$5k，上限$10k)',floor:5000,cap:10000,cond:'達$5k'},
            {id:'red',name:'HSBC Red',type:'cash',score:40,rate:'4%',desc:'網上首$10k (無下限)',cap:10000,cond:''},
            {id:'waku',name:'Aeon Wakuku',type:'cash',score:60,rate:'6%',desc:'網購上限$3,571/$200',cap:3571,cond:''},
            {id:'cheers',name:'BocHK Cheers',type:'cash',score:50,rate:'5%',desc:'紅日網購上限$200',cap:4000,cond:'紅日'},
            {id:'sogo',name:'BocHK Sogo',type:'cash',score:50,rate:'5-15%',desc:'Sogo/手機支付',cond:''},
            {id:'aia',name:'CCB AIA',type:'cash',score:20,rate:'2%',desc:'健康網購',cond:''},
            {id:'ctbc',name:'CTBC',type:'cash',score:15,rate:'1-2%',desc:'promo',cond:''},
            {id:'goyin',name:'BocHK Go 銀聯',type:'cash',score:20,rate:'2%',desc:'內地網購',cond:''}
        ];

        function setType(t,btn){type=t;toggleActive(btn,0);} function setPay(p,btn){pay=p;toggleActive(btn,1);}
        function toggleActive(btn,i){document.querySelectorAll(`.toggle-group:nth-of-type(${i+1}) .toggle-btn`).forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

        function toggleBurst(id){if(exhausted.includes(id))exhausted=exhausted.filter(e=>e!==id);else exhausted.push(id);analyze();}

        function analyze(){
            const amt=parseFloat(document.getElementById('amount').value)||0, merchant=document.getElementById('merchant').value.toLowerCase();
            let cat='general'; if(merchant.includes('apple')||pay==='Online')cat='online'; if(merchant.includes('trip'))cat='travel'; if(type==='FOREIGN')cat='overseas';

            let ranked=cards.map(c=>{
                if(exhausted.includes(c.id))return null;
                let s=c.score, r=c.rate, d=c.desc, warn='';
                // 調整邏輯
                if(c.id==='everymile'&&cat==='travel'){s=20;r='$5/里';} // Trip.com
                if(c.id==='mmpower'&&amt<5000){s=4;warn='(未達$5k 只0.4%)';}
                if(c.id==='waku'&&amt>c.cap){s=4;warn='(爆$3.5k 只0.4%)';}
                if(c.id==='red'&&amt>10000){s=20;warn='(超$10k 降0.4%)';}
                if(pay==='ApplePay'&&c.id==='eye'){s=10;} // promo
                let ret=amt*(s/100); ret=cat==='miles'?`~${Math.round(ret/0.05)}里`:`~$${Math.round(ret)}`;
                return{id:c.id,name:c.name,type:c.type,score:s,rate:r,desc:`${d} ${warn}`,ret};
            }).filter(Boolean).sort((a,b)=>b.score-a.score);

            render('miles',ranked.filter(c=>c.type==='miles').slice(0,3));
            render('cash',ranked.filter(c=>c.type==='cash').slice(0,3));
            document.getElementById('results').style.display='block';
        }

        function render(el,cs){
            document.getElementById(el).innerHTML=cs.map((c,i)=>
                `<div class="card-box ${c.type==='cash'?'cash':''}">
                    <div class="card-name">
                        <span>${i===0?'👑首選':'🥈'+(i+1)} ${c.name}</span>
                        <span class="card-rate ${c.type==='cash'?'card-cash-rate':''}">${c.rate}</span>
                    </div>
                    <div class="detail">${c.desc} • ${c.ret}</div>
                    <button class="burst-btn" onclick="toggleBurst('${c.id}')">🔴已爆額</button>
                </div>`
            ).join('') || '<div class="card-box">無合適</div>';
        }

        document.getElementById('merchant').addEventListener('keypress',e=>e.key==='Enter'&&analyze());
    </script>
</body>
</html>
