<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能信用卡軍師 - 極限分析版</title>
    <style>
        :root {
            --primary-miles: #004a99; /* 渣打/里數藍 */
            --primary-cash: #d91d2b;  /* 恒生/滙豐紅 */
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Header */
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        h1 { margin: 0; font-size: 24px; color: #333; }
        p.subtitle { margin: 5px 0 0; color: #666; font-size: 14px; }

        /* Form Inputs */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        
        /* Toggles */
        .toggle-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .toggle-btn { flex: 1; padding: 10px; border: 1px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; text-align: center; font-weight: bold; }
        .toggle-btn.active { background-color: #333; color: #fff; border-color: #333; }

        /* Action Button */
        .analyze-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .analyze-btn:hover { opacity: 0.9; }

        /* Results Section */
        .results-area { margin-top: 30px; display: none; }
        .section-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; }
        .miles-section .section-title { color: var(--primary-miles); }
        .cash-section .section-title { color: var(--primary-cash); margin-top: 25px; }

        .card-box { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 15px; margin-bottom: 10px; position: relative; border-left: 5px solid #ccc; }
        .card-box.miles-card { border-left-color: var(--primary-miles); background: #f0f7ff; }
        .card-box.cash-card { border-left-color: var(--primary-cash); background: #fff5f5; }
        
        .card-name { font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; }
        .card-rate { color: #d91d2b; font-weight: bold; }
        .card-detail { font-size: 13px; color: #555; margin-top: 5px; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 5px; }
        .badge-miles { background: #e3f2fd; color: #0d47a1; }
        .badge-cash { background: #ffebee; color: #b71c1c; }

        /* Burst Button */
        .burst-btn { background: #ff4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; position: absolute; right: 10px; top: 40px; }
        .burst-btn:hover { background: #cc0000; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>智能簽賬軍師</h1>
        <p class="subtitle">里數優先 x 回贈極限分析</p>
    </header>

    <div class="form-group">
        <label>消費場景 / 商戶 (關鍵字)</label>
        <input type="text" id="merchant" placeholder="例如: Apple, Trip.com, 萬寧, Sogo, 食飯">
    </div>

    <div class="form-group">
        <label>消費金額 ($)</label>
        <input type="number" id="amount" placeholder="輸入金額" value="">
    </div>

    <label>貨幣種類</label>
    <div class="toggle-group">
        <div class="toggle-btn active" onclick="setCurrency('HKD', this)">HKD (港幣)</div>
        <div class="toggle-btn" onclick="setCurrency('FOREIGN', this)">外幣 (海外/網上)</div>
    </div>

    <label>支付方式</label>
    <div class="toggle-group">
        <div class="toggle-btn active" onclick="setMethod('ApplePay', this)">Apple Pay</div>
        <div class="toggle-btn" onclick="setMethod('Physical', this)">實體卡</div>
        <div class="toggle-btn" onclick="setMethod('Online', this)">網上輸入</div>
    </div>

    <button class="analyze-btn" onclick="analyze()">立即分析</button>

    <div id="results" class="results-area">
        <div class="miles-section">
            <div class="section-title">✈️ 里數優先 (首選)</div>
            <div id="miles-list"></div>
        </div>

        <div class="cash-section">
            <div class="section-title">💰 現金/安全 (次選)</div>
            <div id="cash-list"></div>
        </div>
    </div>
</div>

<script>
    // --- 1. 用戶數據 & 狀態 ---
    let currency = 'HKD';
    let method = 'ApplePay';
    let exhaustedCards = []; // 儲存已爆額的卡

    // --- 2. 信用卡資料庫 (你的 14 張卡) ---
    // 這裡定義每張卡的基礎規則
    const myCards = [
        { id: 'eye', name: 'CCB Eye 信用卡', type: 'miles', desc: 'Apple Pay/網購 $3/里 (最強里數)' },
        { id: 'vs', name: 'HSBC Visa Signature', type: 'miles', desc: '賞家居 $2.78/里 (實體店首選)' },
        { id: 'everymile', name: 'HSBC EveryMile', type: 'miles', desc: '外幣/指定 $2/里 (海外首選)' },
        { id: 'mmpower', name: 'HASE MMPOWER', type: 'cash', floor: 5000, desc: '5.4% 回贈 (需簽滿$5k)' },
        { id: 'red', name: 'HSBC Red', type: 'cash', cap: 10000, desc: '網上 4% (無腦必備)' },
        { id: 'waku', name: 'Aeon Wakuwaku', type: 'cash', cap: 3571, desc: '網購 6% (留意低上限)' },
        { id: 'sc_cathay', name: 'SC Cathay Master', type: 'miles', desc: '食肆/網上 $4/里' },
        { id: 'sogo', name: 'BocHK Sogo', type: 'cash', desc: 'Sogo專用/手機支付 5%' },
        { id: 'cheers', name: 'BocHK Cheers', type: 'miles', desc: '餐飲/外幣強' }
        // 其他卡片可按需加入...
    ];

    // --- 3. 輔助功能 ---
    function setCurrency(curr, btn) {
        currency = curr;
        document.querySelectorAll('.toggle-group:nth-of-type(1) .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function setMethod(met, btn) {
        method = met;
        document.querySelectorAll('.toggle-group:nth-of-type(2) .toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function toggleExhausted(cardId) {
        if (exhaustedCards.includes(cardId)) {
            exhaustedCards = exhaustedCards.filter(id => id !== cardId); // 解除爆額
        } else {
            exhaustedCards.push(cardId); // 標記爆額
        }
        analyze(); // 重新計算
    }

    // --- 4. 核心邏輯 (The Brain) ---
    function analyze() {
        const amount = parseFloat(document.getElementById('amount').value) || 0;
        const merchantInput = document.getElementById('merchant').value.toLowerCase();
        
        // A. 判斷類別 (Mapping Logic)
        let category = 'General';
        if (merchantInput.includes('trip') || merchantInput.includes('agoda') || merchantInput.includes('klook')) category = 'Travel_Online';
        else if (merchantInput.includes('apple') || merchantInput.includes('amazon') || merchantInput.includes('taobao')) category = 'Online_Shopping';
        else if (merchantInput.includes('broadway') || merchantInput.includes('fortress') || merchantInput.includes('mannings') || merchantInput.includes('watsons')) category = 'Home';
        else if (merchantInput.includes('keeta') || merchantInput.includes('food') || merchantInput.includes('deliveroo')) category = 'Dining_Online';
        else if (merchantInput.includes('sogo')) category = 'Sogo';
        else if (method === 'Online') category = 'Online_General';
        
        if (currency === 'FOREIGN') category = 'Overseas';

        // B. 計算每張卡的價值
        let rankedCards = myCards.map(card => {
            if (exhaustedCards.includes(card.id)) return null; // 已爆額不計算

            let rateObj = { val: 0, text: '', type: card.type };

            // === 邏輯引擎 ===
            
            // 1. CCB Eye Logic
            if (card.id === 'eye') {
                if ((method === 'ApplePay' || method === 'Online') && currency === 'HKD') {
                    rateObj.val = 33.3; // $3/里 (每$1得33分)
                    rateObj.text = '$3 / 里';
                } else {
                    rateObj.val = 6.6; // 基本 $15/里
                    rateObj.text = '$15 / 里';
                }
            }

            // 2. HSBC VS Logic (賞家居)
            if (card.id === 'vs') {
                if (category === 'Home' && currency === 'HKD') {
                    rateObj.val = 36; // 3.6% RC ~= $2.78/mile
                    rateObj.text = '$2.78 / 里';
                } else {
                    rateObj.val = 16; // 1.6% RC
                    rateObj.text = '$6.25 / 里';
                }
            }

            // 3. HSBC EveryMile Logic
            if (card.id === 'everymile') {
                if (category === 'Overseas' || category === 'Travel_Online') { // 簡化邏輯：假設 Trip.com 用戶用 EveryMile 也有優惠，或海外
                     // 注意：Trip.com 嚴格來說是 $5/里，但如果是外幣簽賬則 $2/里
                     if (currency === 'FOREIGN') {
                        rateObj.val = 50; // $2/里
                        rateObj.text = '$2 / 里';
                     } else {
                        rateObj.val = 20; // $5/里
                        rateObj.text = '$5 / 里';
                     }
                } else {
                    rateObj.val = 20; // 一般 $5/里
                    rateObj.text = '$5 / 里';
                }
            }

            // 4. HASE MMPOWER Logic
            if (card.id === 'mmpower') {
                if (currency === 'FOREIGN') {
                     // 外幣 6% - 1.95% 手續費 = ~4% 淨回贈
                     rateObj.val = 40; // 視為分數比較
                     rateObj.text = '淨回贈 ~4%';
                     rateObj.type = 'cash';
                } else if (method === 'ApplePay' || method === 'Online') {
                    if (amount < 5000 && amount > 0) {
                        rateObj.text = '⚠️ 未達$5k門檻 (僅0.4%)';
                        rateObj.val = 4;
                    } else {
                        rateObj.val = 54; // 5.4%
                        rateObj.text = '5.4% (+FUN Dollars)';
                    }
                } else {
                    rateObj.val = 4;
                    rateObj.text = '0.4% (基本)';
                }
            }

            // 5. Aeon Wakuwaku Logic
            if (card.id === 'waku') {
                if (method === 'Online' || category.includes('Online')) {
                    if (amount > 3571) {
                        rateObj.text = '⚠️ 爆Cap警示 (回贈被溝淡)';
                        rateObj.val = 25; // 懲罰性降分
                    } else {
                        rateObj.val = 60; // 6%
                        rateObj.text = '6% 現金回贈';
                    }
                } else {
                    rateObj.val = 5;
                    rateObj.text = '0.5%';
                }
            }

            // 6. HSBC Red Logic
            if (card.id === 'red') {
                if (category.includes('Online') || method === 'Online') {
                    if (amount > 10000) {
                        rateObj.text = '⚠️ 超出$10k (部分0.4%)';
                        rateObj.val = 20; 
                    } else {
                        rateObj.val = 40; // 4%
                        rateObj.text = '4% 獎賞錢';
                    }
                } else {
                    rateObj.val = 10;
                    rateObj.text = '1%';
                }
            }

             // 7. SC Cathay Logic
             if (card.id === 'sc_cathay') {
                if (category.includes('Dining') || category.includes('Online')) {
                    rateObj.val = 25; // $4/里
                    rateObj.text = '$4 / 里';
                } else {
                    rateObj.val = 16.6; // $6/里
                    rateObj.text = '$6 / 里';
                }
            }

             // 8. Sogo Logic
             if (card.id === 'sogo') {
                 if (category === 'Sogo') {
                     rateObj.text = '先問有無 5% / 10% 折扣!';
                     rateObj.val = 999; // 絕對優先
                 } else if (method === 'ApplePay') {
                     rateObj.val = 50; // 5%
                     rateObj.text = '5% (手機支付)';
                 }
             }

            return { ...card, ...rateObj };
        }).filter(c => c !== null);

        // C. 排序與顯示
        // 分離里數卡與現金卡
        let milesCards = rankedCards.filter(c => c.type === 'miles').sort((a, b) => b.val - a.val);
        let cashCards = rankedCards.filter(c => c.type === 'cash').sort((a, b) => b.val - a.val);

        renderList('miles-list', milesCards, amount);
        renderList('cash-list', cashCards, amount);

        document.getElementById('results').style.display = 'block';
    }

    function renderList(elementId, cards, amount) {
        const container = document.getElementById(elementId);
        container.innerHTML = '';
        
        // 只顯示前 2 名
        cards.slice(0, 2).forEach((card, index) => {
            let actualReturn = '';
            // 簡單回贈估算文字
            if (card.text.includes('%')) {
                let p = parseFloat(card.text) / 100;
                let val = Math.floor(amount * p);
                actualReturn = `(約 $${val})`;
            } else if (card.text.includes('/ 里')) {
                let dollarsPerMile = parseFloat(card.text.split('$')[1]);
                let miles = Math.floor(amount / dollarsPerMile);
                actualReturn = `(約 ${miles} 里)`;
            }

            let rank = index === 0 ? '👑 首選' : '🥈 次選';
            let styleClass = card.type === 'miles' ? 'miles-card' : 'cash-card';
            
            let html = `
                <div class="card-box ${styleClass}">
                    <div class="card-name">
                        <span>${rank}: ${card.name}</span>
                        <span class="card-rate">${card.text}</span>
                    </div>
                    <div class="card-detail">
                        ${card.desc} ${actualReturn}
                    </div>
                    <button class="burst-btn" onclick="toggleExhausted('${card.id}')">🔴 此卡已爆額</button>
                </div>
            `;
            container.innerHTML += html;
        });
        
        if (cards.length === 0) container.innerHTML = '<div class="card-box">暫無合適推薦</div>';
    }
</script>

</body>
</html>
