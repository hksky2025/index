<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能簽賬軍師 V27.8 - 2026 百業商戶終極版</title>
    <style>
        :root { --boc: #b31d28; --hsbc: #db0011; --hangseng: #008154; --sc: #006b4d; --ccb: #003b8e; --aeon: #800080; --miles: #004a99; --cash: #d32f2f; }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f2f5f8; margin: 0; padding: 10px; color: #1a1a1a; }
        
        .container { max-width: 650px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); box-sizing: border-box; overflow: hidden; }
        
        header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; color: #1a1a1a; letter-spacing: -1px; }
        header p { margin: 5px 0 0; font-size: 13px; color: #666; font-weight: 500; }

        .search-section { background: linear-gradient(135deg, #1a1a1a, #333); color: #fff; padding: 20px; border-radius: 20px; margin-bottom: 20px; box-sizing: border-box; width: 100%; }
        .search-section label { font-size: 14px; color: #bbb; display: block; margin-bottom: 8px; }
        
        #merchantSearch { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: none; 
            font-size: 16px; 
            font-weight: 700; 
            outline: none; 
            box-sizing: border-box; /* 修正溢出關鍵 */
            display: block;
        }
        
        .match-hint { font-size: 13px; color: #4caf50; margin-top: 10px; font-weight: bold; min-height: 1.2em; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: #555; }
        
        select, input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            border: 1.5px solid #eee; 
            border-radius: 12px; 
            font-size: 15px; 
            box-sizing: border-box; 
            background: #fafafa; 
        }

        .toggle-container { display: flex; gap: 5px; background: #f0f0f0; padding: 4px; border-radius: 12px; box-sizing: border-box; }
        .toggle-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; color: #666; background: none; transition: 0.2s; white-space: nowrap; }
        .toggle-btn.active { background: #fff; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .analyze-btn { width: 100%; padding: 18px; background: #db0011; color: #fff; border: none; border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 15px rgba(219,0,17,0.2); }
        
        .section-header { margin-top: 30px; padding-bottom: 10px; border-bottom: 2px solid #eee; font-size: 18px; font-weight: 800; }
        .section-header.miles { color: var(--miles); }
        .section-header.cash { color: var(--cash); }

        .card-box { border: 1px solid #f0f0f0; border-radius: 18px; padding: 16px; margin-top: 12px; border-left: 6px solid #ccc; background: #fff; position: relative; }
        .boc-card { border-left-color: var(--boc); }
        .hsbc-card { border-left-color: var(--hsbc); }
        .hangseng-card { border-left-color: var(--hangseng); }
        .sc-card { border-left-color: var(--sc); }
        .ccb-card { border-left-color: var(--ccb); }
        .aeon-card { border-left-color: var(--aeon); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .earn-val { font-size: 22px; font-weight: 900; text-align: right; letter-spacing: -0.5px; }
        .promo-tag { background: #fff3e0; color: #e65100; font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 800; display: inline-block; margin-top: 5px; }
        .card-desc { font-size: 12px; color: #777; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px; line-height: 1.5; }
        .warn-msg { color: #d32f2f; font-weight: 700; font-size: 11px; margin-top: 5px; display: block; }

        .note { font-size: 11px; color: #999; text-align: center; margin-top: 30px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💳 智能簽賬軍師 V27.8</h1>
        <p>2026 終極商戶大數據版本</p>
    </header>

    <div class="search-section">
        <label>🔍 輸入商戶名稱 (自動識別 VS賞家居 / EveryMile $2 / 狂賞派)</label>
        <input type="text" id="merchantSearch" placeholder="搜尋: KeyChain Pay, Donki, 港鐵, Q-Pets..." oninput="autoMatch()">
        <div id="matchHint" class="match-hint"></div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>當月累計簽賬 (HKD)</label>
            <input type="number" id="currentSpent" value="0">
        </div>
        <div class="input-group">
            <label>本次金額 (HKD)</label>
            <input type="number" id="amount" placeholder="金額" inputmode="numeric">
        </div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>日期時段</label>
            <div class="toggle-container">
                <button class="toggle-btn active" onclick="setDay(false, this)">平日</button>
                <button class="toggle-btn" onclick="setDay(true, this)" style="color:#d32f2f">紅日/週末</button>
            </div>
        </div>
        <div class="input-group">
            <label>支付方式</label>
            <div class="toggle-container" id="methodToggles">
                <button class="toggle-btn active" onclick="setMethod('ApplePay', this)">手機支付</button>
                <button class="toggle-btn" onclick="setMethod('Online', this)">網上/App</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>類別判定 (自動偵測)</label>
        <select id="category">
            <option value="General">-- 一般本地消費 --</option>
            <option value="Dining">🍽️ 餐飲食肆 (狂賞/自選)</option>
            <option value="Online">🛍️ 網上零售 (眼卡/Waku)</option>
            <option value="Electronics">🔌 電子產品/電訊 (VS賞家居/狂賞)</option>
            <option value="Super">🛒 超級市場 (VS賞家居/Mox)</option>
            <option value="Transport">🚌 交通/叫車/油站 (EveryMile)</option>
            <option value="Home">🏠 家居用品/交租 (VS賞家居)</option>
            <option value="Pet">🐾 寵物護理 (狂賞派)</option>
            <option value="Travel">✈️ 旅遊機票/酒店 (狂賞/CX)</option>
            <option value="Overseas">🌍 海外外幣 (Cheers/MMPOWER)</option>
        </select>
    </div>

    <button class="analyze-btn" onclick="analyze()">精確運算最佳組合</button>

    <div id="results" style="display:none;">
        <div class="section-header miles">✈️ 里數優先建議 (高至低)</div>
        <div id="miles-results"></div>
        <div class="section-header cash">💰 現金回贈建議 (高至低)</div>
        <div id="cash-results"></div>
    </div>
</div>

<script>
    let isRedDay = false;
    let method = 'ApplePay';

    const merchantDB = [
        // --- 交通出行 (EveryMile $2/里) ---
        { name: "港鐵", cat: "Transport", sub: "EM", meth: "ApplePay" },
        { name: "巴士", cat: "Transport", sub: "EM", meth: "ApplePay" },
        { name: "小巴", cat: "Transport", sub: "EM", meth: "ApplePay" },
        { name: "輕鐵", cat: "Transport", sub: "EM", meth: "ApplePay" },
        { name: "電車", cat: "Transport", sub: "EM", meth: "ApplePay" },
        { name: "渡海小輪", cat: "Transport", sub: "EM", meth: "ApplePay" },
        { name: "Uber", cat: "Transport", sub: "EM", meth: "Online" },
        { name: "高德", cat: "Transport", sub: "EM", meth: "Online" },

        // --- 超級市場 (VS 賞家居 3.6%) ---
        { name: "759阿信屋", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "Big C", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "Don Don Donki", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "大生生活超市", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "百佳", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "TASTE", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "FUSION", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "INTERNATIONAL", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "food le parc", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "新鮮生活", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "GreenPrice", cat: "Super", sub: "VS", meth: "ApplePay" },
        { name: "本灣水產", cat: "Super", sub: "VS", meth: "ApplePay" },

        // --- 家居用品 & 交租 (VS 賞家居 3.6%) ---
        { name: "日本城", cat: "Home", sub: "VS", meth: "ApplePay" },
        { name: "KeyChain Pay", cat: "Home", sub: "VS", meth: "Online" },
        { name: "at.home", cat: "Home", sub: "VS", meth: "ApplePay" },
        { name: "生活提案", cat: "Home", sub: "VS", meth: "ApplePay" },
        { name: "生活工房", cat: "Home", sub: "VS", meth: "ApplePay" },
        { name: "蓆夢思", cat: "Home", sub: "VS", meth: "ApplePay" },
        { name: "歐化", cat: "Home", sub: "VS", meth: "ApplePay" },

        // --- 電器 & 電訊 (VS 賞家居 3.6% & 狂賞派) ---
        { name: "豐澤", cat: "Electronics", sub: "VS_BOC", meth: "ApplePay" },
        { name: "百老滙", cat: "Electronics", sub: "VS_BOC", meth: "ApplePay" },
        { name: "蘇寧", cat: "Electronics", sub: "VS_BOC", meth: "ApplePay" },
        { name: "衛訊", cat: "Electronics", sub: "VS_BOC", meth: "ApplePay" },
        { name: "友和", cat: "Electronics", sub: "VS_BOC", meth: "Online" },
        { name: "YOHO", cat: "Electronics", sub: "VS_BOC", meth: "Online" },
        { name: "csl", cat: "Electronics", sub: "VS", meth: "ApplePay" },
        { name: "1O1O", cat: "Electronics", sub: "VS", meth: "ApplePay" },
        { name: "SmarTone", cat: "Electronics", sub: "VS", meth: "ApplePay" },
        { name: "3香港", cat: "Electronics", sub: "VS", meth: "ApplePay" },
        { name: "Now TV", cat: "Electronics", sub: "VS", meth: "Online" },
        { name: "網上行", cat: "Electronics", sub: "VS", meth: "Online" },

        // --- 寵物護理 (中銀狂賞派) ---
        { name: "Q-Pets", cat: "Pet", sub: "BOC", meth: "ApplePay" },
        { name: "Petmium", cat: "Pet", sub: "BOC", meth: "ApplePay" },
        { name: "寵寵線", cat: "Pet", sub: "BOC", meth: "ApplePay" },
        { name: "紅蘿蔔", cat: "Pet", sub: "BOC", meth: "ApplePay" },
        { name: "Whiskers N Paws", cat: "Pet", sub: "BOC", meth: "ApplePay" }
    ];

    function autoMatch() {
        const input = document.getElementById('merchantSearch').value.toLowerCase();
        const hint = document.getElementById('matchHint');
        const catSelect = document.getElementById('category');
        if (!input) { hint.innerText = ""; return; }

        const match = merchantDB.find(m => m.name.toLowerCase().includes(input));
        if (match) {
            hint.innerText = `✅ 已自動識別: ${match.name}`;
            catSelect.value = match.cat;
            setMethod(match.meth, document.querySelectorAll('#methodToggles .toggle-btn')[match.meth === 'Online' ? 1 : 0]);
        } else {
            hint.innerText = "";
        }
    }

    function setDay(v, b) { isRedDay = v; toggleActive(b); }
    function setMethod(m, b) { 
        method = m; 
        const btns = document.querySelectorAll('#methodToggles .toggle-btn');
        btns.forEach(btn => btn.classList.remove('active'));
        if (b) b.classList.add('active');
    }
    function toggleActive(b) {
        b.closest('.toggle-container').querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
    }

    const cards = [
        { id: 'sc_cathay', name: '渣打國泰卡', bank: 'sc', type: 'miles', logic: (amt, cat) => {
            let r = (['Dining', 'Travel', 'Overseas'].includes(cat) ? 4 : 6);
            return { val: amt * (0.1/r), miles: Math.floor(amt/r), rate: `$${r}/里` };
        }},
        { id: 'ccb_eye', name: '建銀 eye 卡', bank: 'ccb', type: 'miles', logic: (amt, cat, meth) => {
            let isBonus = (meth === 'Online' || meth === 'ApplePay');
            let miles = Math.floor(amt / (isBonus ? 3 : 15));
            return { val: miles * 0.1, miles: miles, rate: isBonus ? '$3/里' : '$15/里' };
        }},
        { id: 'cheers', name: '中銀 Cheers VI', bank: 'boc', type: 'miles', logic: (amt, cat, meth, isMet) => {
            let isBonus = (cat === 'Dining' || cat === 'Overseas') && isMet;
            return { val: isBonus ? amt * 0.04 : amt * 0.004, miles: Math.floor(amt / (isBonus ? 1.5 : 15)), rate: isBonus ? '$1.5/里' : '$15/里' };
        }},
        { id: 'everymile', name: 'HSBC EveryMile', bank: 'hsbc', type: 'miles', logic: (amt, cat, meth, isMet, sub) => {
            let isBonus = sub === "EM" || cat === "Transport" || cat === "Overseas";
            return { val: isBonus ? amt * 0.025 : amt * 0.01, miles: isBonus ? Math.floor(amt/2) : Math.floor(amt/5), rate: isBonus ? '$2/里' : '$5/里' };
        }},
        { id: 'red', name: 'HSBC Red', bank: 'hsbc', type: 'cash', logic: (amt, cat, meth) => {
            if (meth === 'Online') return amt <= 10000 ? { val: amt * 0.04, rate: '4%' } : { val: 400 + (amt-10000)*0.01, rate: '1%' };
            return { val: amt * 0.01, rate: '1%' };
        }},
        { id: 'mmpower', name: '恒生 MMPOWER', bank: 'hangseng', type: 'cash', logic: (amt, cat, meth, isMet) => {
            if (!isMet) return { val: amt * 0.004, rate: '0.4%' };
            if (cat === 'Overseas') return { val: Math.min(amt * 0.06, 500 + amt*0.004), rate: '6%' };
            if (meth === 'Online') return { val: Math.min(amt * 0.05, 500 + amt*0.004), rate: '5%' };
            return { val: amt * 0.01, rate: '1%' };
        }},
        { id: 'vs', name: 'HSBC VS (賞家居)', bank: 'hsbc', type: 'cash', logic: (amt, cat, meth, isMet, sub) => {
            let isHome = sub === "VS" || sub === "VS_BOC" || ['Home','Electronics','Super'].includes(cat);
            return { val: isHome ? amt * 0.036 : amt * 0.004, rate: isHome ? '3.6%' : '0.4%' };
        }},
        { id: 'sogo', name: '中銀 Sogo Visa', bank: 'boc', type: 'cash', logic: (amt, cat, meth) => {
            if (meth === 'ApplePay') return amt <= 2000 ? { val: amt * 0.054, rate: '5.4%' } : { val: 108 + (amt-2000)*0.004, rate: '5.4%封頂' };
            return { val: amt * 0.004, rate: '0.4%' };
        }}
    ];

    function analyze() {
        const spent = parseFloat(document.getElementById('currentSpent').value) || 0;
        const amt = parseFloat(document.getElementById('amount').value);
        const cat = document.getElementById('category').value;
        const input = document.getElementById('merchantSearch').value.toLowerCase();
        if (!amt) return alert("請輸入金額");

        const match = merchantDB.find(m => m.name.toLowerCase().includes(input));
        const sub = match ? match.sub : null;
        const isMet = (spent + amt) >= 5000;

        let processed = cards.map(c => {
            let res = c.logic(amt, cat, method, isMet, sub);
            let promo = 0, pDesc = "";
            const isCrazy = ['Dining','Electronics','Pet','Travel'].includes(cat) || sub === "BOC" || sub === "VS_BOC";
            
            if (['cheers', 'sogo'].includes(c.id) && isMet && amt >= 500 && isCrazy) {
                promo = (method === 'Online') ? (isRedDay ? Math.min(amt * 0.05, 200) : Math.min(amt * 0.02, 60)) 
                                             : (isRedDay ? Math.min(amt * 0.05, 300) : Math.min(amt * 0.02, 120));
                pDesc = `狂賞派(+${isRedDay?5:2}%)`;
            }
            return { ...c, res, promo, pDesc };
        });

        const miles = processed.filter(c => c.type === 'miles').sort((a,b) => b.res.miles - a.res.miles);
        const cash = processed.filter(c => c.type === 'cash').sort((a,b) => (b.res.val + b.promo) - (a.res.val + a.promo));

        document.getElementById('results').style.display = 'block';
        const mc = document.getElementById('miles-results'); mc.innerHTML = '';
        const cc = document.getElementById('cash-results'); cc.innerHTML = '';
        miles.forEach(c => mc.innerHTML += createHtml(c, amt, true));
        cash.forEach(c => cc.innerHTML += createHtml(c, amt, false));
    }

    function createHtml(c, amt, isMile) {
        const earn = isMile ? `${c.res.miles} 里` : `$${(c.res.val + c.promo).toFixed(1)}`;
        const bocWarn = (amt < 500 && ['cheers', 'sogo'].includes(c.id)) ? `<div class="warn-msg">! 單筆未滿$500 無狂賞加乘</div>` : "";
        return `
            <div class="card-box ${c.bank}-card">
                <div class="card-top">
                    <div class="card-name">${c.name}${c.promo > 0 ? `<br><span class="promo-tag">🔥 ${c.pDesc}</span>` : ""}</div>
                    <div class="earn-val" style="color:${isMile?'var(--miles)':'var(--cash)'}">${earn}${isMile && c.promo > 0 ? `<div style="font-size:11px;color:#e65100">+$${c.promo.toFixed(0)}</div>` : ""}</div>
                </div>
                <div class="card-desc">回贈率: ${c.res.rate} ${bocWarn}</div>
            </div>
        `;
    }
</script>
</body>
</html>
