<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智能簽賬軍師 V49.0</title>

    <!-- iOS PWA 100% 繼承自 V28.1 圖標 -->
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/您的用戶名/您的倉庫名/main/icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="簽賬軍師">

    <style>
        :root { 
            --boc: #b31d28; --hsbc: #db0011; --hangseng: #008154; 
            --sc: #006b4d; --ccb: #003b8e; --aeon: #800080; --citic: #ed1c24; --mox: #05d5a1;
            --miles: #004a99; --cash: #d32f2f; --bg: #f2f5f8; 
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); margin: 0; padding: env(safe-area-inset-top) 10px 30px 10px; color: #1a1a1a; 
        }
        
        .container { max-width: 650px; margin: 10px auto; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); width: 100%; }
        
        header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; }
        header h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        header p { margin: 5px 0 0; font-size: 12px; color: #888; }

        /* 信用卡管理面板 */
        .manager-toggle-btn { width: 100%; padding: 12px; background: #f0f2f5; border: 1px solid #ddd; border-radius: 12px; font-size: 13px; font-weight: 700; color: #555; cursor: pointer; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .card-manager-content { display: none; background: #fafafa; border: 1px solid #eee; border-radius: 20px; padding: 15px; margin-bottom: 20px; }
        .bank-name-label { font-size: 11px; font-weight: 700; color: #aaa; text-transform: uppercase; margin: 10px 0 5px 0; }
        .toggle-grid { display: flex; flex-wrap: wrap; gap: 6px; }
        .toggle-card-btn { padding: 8px 12px; border-radius: 10px; border: 1.5px solid #eee; font-size: 11px; font-weight: 700; cursor: pointer; background: #fff; color: #ccc; transition: 0.2s; }
        .toggle-card-btn.active.hsbc { border-color: var(--hsbc); color: var(--hsbc); background: #fff5f5; }
        .toggle-card-btn.active.boc { border-color: var(--boc); color: var(--boc); background: #fff5f5; }
        .toggle-card-btn.active.hangseng { border-color: var(--hangseng); color: var(--hangseng); background: #f5fff5; }
        .toggle-card-btn.active.sc { border-color: var(--sc); color: var(--sc); background: #f5fff5; }
        .toggle-card-btn.active.ccb { border-color: var(--ccb); color: var(--ccb); background: #f5f8ff; }
        .toggle-card-btn.active.citic { border-color: var(--citic); color: var(--citic); background: #fff5f5; }
        .toggle-card-btn.active.mox { border-color: var(--mox); color: #111; background: #f5fff5; }
        .toggle-card-btn.active.aeon { border-color: var(--aeon); color: var(--aeon); background: #fff5ff; }

        /* 搜尋區域 */
        .search-section { background: linear-gradient(135deg, #1a1a1a, #333); color: #fff; padding: 20px; border-radius: 20px; margin-bottom: 20px; }
        .search-section label { font-size: 13px; color: #bbb; display: block; margin-bottom: 8px; }
        #merchantSearch { width: 100%; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: 700; outline: none; color: #000; }
        .match-hint { font-size: 13px; color: #4caf50; margin-top: 10px; font-weight: bold; min-height: 1.2em; }
        
        /* 響應式佈局：防止重疊 */
        .input-row { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; width: 100%; }
        .input-group { flex: 1; min-width: 280px; } 
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: #555; }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 12px; font-size: 15px; background: #fafafa; outline: none; }

        .date-status-tag { font-size: 11px; font-weight: 800; margin-top: 4px; display: inline-block; padding: 2px 6px; border-radius: 4px; }
        .is-red { background: #ffebee; color: #d32f2f; }
        .is-normal { background: #f0f0f0; color: #666; }

        .toggle-container { display: flex; gap: 5px; background: #f0f0f0; padding: 4px; border-radius: 12px; width: 100%; }
        .toggle-btn { flex: 1; padding: 11px 5px; border: none; border-radius: 9px; cursor: pointer; font-size: 12px; font-weight: 700; color: #666; background: none; transition: 0.2s; }
        .toggle-btn.active { background: #fff; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        
        .analyze-btn { width: 100%; padding: 18px; background: #db0011; color: #fff; border: none; border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        
        .section-header { margin-top: 30px; padding-bottom: 10px; border-bottom: 2px solid #eee; font-size: 18px; font-weight: 800; }
        .section-header.miles { color: var(--miles); }
        .section-header.cash { color: var(--cash); }

        .card-box { border: 1px solid #f0f0f0; border-radius: 18px; padding: 16px; margin-top: 12px; border-left: 6px solid #ccc; background: #fff; position: relative; }
        .boc-card { border-left-color: var(--boc); } .hsbc-card { border-left-color: var(--hsbc); } .hangseng-card { border-left-color: var(--hangseng); } .sc-card { border-left-color: var(--sc); } .ccb-card { border-left-color: var(--ccb); } .citic-card { border-left-color: var(--citic); } .mox-card { border-left-color: var(--mox); } .aeon-card { border-left-color: var(--aeon); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .earn-val { font-size: 22px; font-weight: 900; text-align: right; letter-spacing: -0.5px; }
        .promo-tag { background: #fff3e0; color: #e65100; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; display: inline-block; margin-top: 4px; border: 1px solid #ffe0b2; }
        .card-desc { font-size: 12px; color: #777; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 10px; line-height: 1.5; }
        .remark-tip { font-size: 11px; color: #e65100; font-weight: 600; margin-top: 5px; padding: 4px 0; display: block; border-top: 1px solid #fff3e0; }

        @media (max-width: 450px) { .input-group { min-width: 100%; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💳 智能簽賬軍師 V49.0</h1>
        <p>13張全卡數據 | 商戶識別邏輯修正版</p>
    </header>

    <button class="manager-toggle-btn" onclick="toggleManager()">
        ⚙️ 編輯我的卡片清單 (13張卡管理)
    </button>
    <div id="cardManagerPanel" class="card-manager-content">
        <div id="bankGroupsContainer"></div>
    </div>

    <div class="search-section">
        <label>🔍 搜尋商戶 (100% 數據保留：MTR, fresh, Apple, 萬寧, csl...)</label>
        <input type="text" id="merchantSearch" placeholder="搜尋商戶名稱..." oninput="autoMatch()">
        <div id="matchHint" class="match-hint"></div>
    </div>

    <div class="input-row">
        <div class="input-group"><label>當月累積簽賬 (HKD)</label><input type="number" id="currentSpent" value="0"></div>
        <div class="input-group"><label>本次金額 (HKD)</label><input type="number" id="amount" placeholder="金額" inputmode="numeric"></div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>簽賬日期 (校對2026官方紅日)</label>
            <input type="date" id="txnDate" onchange="checkDateStatus()">
            <div id="dateStatus" class="date-status-tag"></div>
        </div>
        <div class="input-group">
            <label>支付方式</label>
            <div class="toggle-container">
                <button id="meth-ap" class="toggle-btn active" onclick="updateMethod('ApplePay')">手機支付</button>
                <button id="meth-on" class="toggle-btn" onclick="updateMethod('Online')">網上/App</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>類別判定 (狂賞/賞家居連動)</label>
        <select id="category">
            <option value="General">-- 一般本地消費 --</option>
            <option value="Dining">🍽️ 餐飲食肆 (狂賞/Motion 6%)</option>
            <option value="Online">🛍️ 一般網購 (eye卡/Waku/Motion)</option>
            <option value="Electronics">🔌 電子產品/電訊 (賞家居/狂賞)</option>
            <option value="Super">🛒 超級市場 (VS/Mox/Go卡)</option>
            <option value="Transport">🚌 交通出行 (EveryMile $2)</option>
            <option value="Home">🏠 家居用品/交租 (VS賞家居)</option>
            <option value="Pet">🐾 寵物護理 (狂賞派)</option>
            <option value="Leisure">🎡 休閒娛樂 (狂賞派)</option>
            <option value="Medical">🏥 醫療服務 (狂賞派)</option>
            <option value="Travel">✈️ 旅遊平台 (狂賞/CX)</option>
            <option value="Jewelry">💍 珠寶服飾 (狂賞/Red 8%)</option>
            <option value="Coffee">☕ 咖啡輕食 (EveryMile)</option>
            <option value="Overseas">🌍 海外外幣 (Cheers/MMPOWER)</option>
        </select>
    </div>

    <button class="analyze-btn" onclick="analyze()">精確運算最佳分組排序</button>

    <div id="results" style="display:none;">
        <div class="section-header miles">✈️ 里數優先建議 (高至低)</div>
        <div id="miles-results"></div>
        <div class="section-header cash">💰 現金回贈建議 (高至低)</div>
        <div id="cash-results"></div>
    </div>
</div>

<script>
// 一、2026 公眾假期 (嚴格對照附件)
const HOLIDAYS_2026 = ["2026-01-01","2026-02-17","2026-02-18","2026-02-19","2026-04-03","2026-04-04","2026-04-06","2026-04-07","2026-05-01","2026-05-25","2026-06-19","2026-07-01","2026-09-26","2026-10-01","2026-10-19","2026-12-25","2026-12-26"];

// 二、150+ 商戶旗艦數據庫 (從 V28.1 完整繼承)
const merchantDB = [
    { name: "港鐵", cat: "Transport", sub: "EM", meth: "ApplePay" }, { name: "mtr", cat: "Transport", sub: "EM", meth: "ApplePay" },
    { name: "小巴", cat: "Transport", sub: "EM", meth: "ApplePay" }, { name: "電車", cat: "Transport", sub: "EM", meth: "ApplePay" },
    { name: "新鮮生活(fresh)", cat: "Super", sub: "VS", meth: "ApplePay" }, { name: "fresh", cat: "Super", sub: "VS", meth: "ApplePay" },
    { name: "Apple", cat: "Electronics", sub: "BOC_VS", meth: "ApplePay" }, { name: "KeyChain Pay", cat: "Home", sub: "VS", meth: "Online" },
    { name: "Don Don Donki", cat: "Super", sub: "VS", meth: "ApplePay" }, { name: "donki", cat: "Super", sub: "VS", meth: "ApplePay" },
    { name: "759阿信屋", cat: "Super", sub: "VS", meth: "ApplePay" }, { name: "百佳", cat: "Super", sub: "VS", meth: "ApplePay" },
    { name: "csl", cat: "Electronics", sub: "VS", meth: "ApplePay" }, { name: "萬寧", cat: "Super", sub: "VS", meth: "ApplePay" },
    { name: "Q-Pets", cat: "Pet", sub: "BOC", meth: "ApplePay" }, { name: "Pop Mart", cat: "Leisure", sub: "BOC", meth: "ApplePay" },
    { name: "壽司郎", cat: "Dining", sub: "Red8_BOC", meth: "ApplePay" }, { name: "國泰航空", cat: "Travel", sub: "CX", meth: "Online" },
    { name: "淘寶", cat: "Online", sub: "EYE", meth: "Online" }
];

const PROMOTION_HUB = [{ id: "hsbc_mannings_winter", bank: "hsbc", name: "HSBC 萬寧冬日優惠", startDate: "2025-12-01", endDate: "2026-02-28", keywords: ["萬寧"], minAmt: 500, remarks: "⚠️ 需登記！簽滿$1000計。紅日最高+5RC%。", bonusFunc: (amt, isRed) => Math.min(amt * 0.05, 300) + (isRed ? Math.min(amt * 0.05, 150) : 0) }];

// 三、13 張信用卡資料 (鎖死不刪)
const cards = [
    { id: 'red', name: 'HSBC Red', bank: 'hsbc', type: 'cash', logic: (amt, cat, meth, isMet, sub) => { if (sub && sub.includes('Red8')) return { val: amt * 0.08, rate: '8%' }; return (meth === 'Online') ? (amt <= 10000 ? { val: amt * 0.04, rate: '4%' } : { val: 400 + (amt-10000)*0.01, rate: '4%封頂' }) : { val: amt * 0.01, rate: '1%' }; }},
    { id: 'everymile', name: 'HSBC EveryMile', bank: 'hsbc', type: 'miles', logic: (amt, cat, meth, isMet, sub) => { let isB = sub === "EM" || cat === "Transport" || cat === "Overseas" || cat === "Coffee"; return { val: isB ? amt * 0.025 : amt * 0.01, miles: isB ? Math.floor(amt/2) : Math.floor(amt/5), rate: isB ? '$2/里' : '$5/里' }; }},
    { id: 'vs', name: 'HSBC VS (賞家居)', bank: 'hsbc', type: 'cash', logic: (amt, cat, meth, isMet, sub) => { let isH = (sub && sub.includes('VS')) || ['Home','Electronics','Super'].includes(cat); return { val: isH ? amt * 0.036 : amt * 0.004, rate: isH ? '3.6%' : '0.4%' }; }},
    { id: 'cheers', name: '中銀 Cheers VI', bank: 'boc', type: 'both', logic: (amt, cat, meth, isMet) => { let isB = (cat === 'Dining' || cat === 'Overseas') && isMet; return { val: isB ? amt * 0.04 : amt * 0.004, miles: Math.floor(amt / (isMet && (cat === 'Dining' || cat === 'Overseas') ? 1.5 : 15)), rate: isB ? '$1.5/里' : '$15/里' }; }},
    { id: 'sogo', name: '中銀 Sogo Visa', bank: 'boc', type: 'both', logic: (amt, cat, meth) => { if (meth === 'ApplePay') return amt <= 2000 ? { val: amt * 0.054, rate: '5.4%' } : { val: 108 + (amt-2000)*0.004, rate: '5.4%封頂' }; return { val: amt * 0.004, rate: '0.4%' }; }},
    { id: 'go', name: '中銀 Go銀聯卡', bank: 'boc', type: 'both', logic: (amt, cat) => { let r = (cat === 'Super') ? 0.05 : 0.004; return { val: amt * r, rate: (r*100) + '%' }; }},
    { id: 'mmpower', name: '恒生 MMPOWER', bank: 'hangseng', type: 'cash', logic: (amt, cat, meth, isMet) => { if (!isMet) return { val: amt * 0.004, rate: '0.4%' }; if (cat === 'Overseas') return { val: Math.min(amt * 0.06, 500 + amt*0.004), rate: '6%' }; if (meth === 'Online') return { val: Math.min(amt * 0.05, 500 + amt*0.004), rate: '5%' }; return { val: amt * 0.01, rate: '1%' }; }},
    { id: 'sc_cathay', name: '渣打國泰卡', bank: 'sc', type: 'miles', logic: (amt, cat, meth, isMet, sub) => { let r = (sub === "CX") ? 2 : (['Dining', 'Travel', 'Overseas'].includes(cat) ? 4 : 6); return { val: amt * (0.1/r), miles: Math.floor(amt/r), rate: `$${r}/里` }; }},
    { id: 'ccb_eye', name: '建銀 eye卡', bank: 'ccb', type: 'miles', logic: (amt, cat, meth) => { let isB = (meth === 'Online' || meth === 'ApplePay'); let m = Math.floor(amt / (isB ? 3 : 15)); return { val: m * 0.1, miles: m, rate: isB ? '$3/里' : '$15/里' }; }},
    { id: 'aia', name: '建銀 AIA卡', bank: 'ccb', type: 'cash', logic: (amt) => ({ val: amt * 0.005, rate: '0.5%' })},
    { id: 'motion', name: '中信 Motion', bank: 'citic', type: 'cash', logic: (amt, cat, meth) => { let isB = (cat === 'Dining' || cat === 'Online' || meth === 'Online'); if (isB) return amt <= 3636 ? { val: amt * 0.06, rate: '6%' } : { val: 218 + (amt-3636)*0.005, rate: '6%封頂' }; return { val: amt * 0.005, rate: '0.5%' }; }},
    { id: 'mox', name: 'Mox Credit', bank: 'mox', type: 'cash', logic: (amt, cat) => { let r = (cat === 'Super') ? 0.03 : 0.01; return { val: amt * r, rate: (r*100) + '%' }; }},
    { id: 'waku', name: 'Aeon Wakuwaku', bank: 'aeon', type: 'cash', logic: (amt, cat, meth) => { if (meth === 'Online') return amt <= 3571 ? { val: amt * 0.06, rate: '6%' } : { val: 214.3 + (amt-3571)*0.005, rate: '6%封頂' }; return { val: amt * 0.005, rate: '0.5%' }; }}
];

// 四、軍師核心大腦
let globalMethod = 'ApplePay', isRedDay = false, cardStatus = {};

window.onload = () => {
    document.getElementById('txnDate').value = new Date().toISOString().split('T')[0];
    checkDateStatus(); initManager();
};

function checkDateStatus() {
    const s = document.getElementById('txnDate').value;
    isRedDay = ([0,5,6].includes(new Date(s).getDay())) || HOLIDAYS_2026.includes(s);
    const tag = document.getElementById('dateStatus');
    tag.innerText = isRedDay ? "🔥 紅日獎賞激活" : "📅 平日獎賞";
    tag.className = "date-status-tag " + (isRedDay ? "is-red" : "is-normal");
}

function updateMethod(m) {
    globalMethod = m;
    document.getElementById('meth-ap').classList.toggle('active', m === 'ApplePay');
    document.getElementById('meth-on').classList.toggle('active', m === 'Online');
}

// 核心識別邏輯修正
function autoMatch() {
    const raw = document.getElementById('merchantSearch').value.trim();
    if (!raw) return;
    const input = raw.toLowerCase();
    
    // 1. 全等匹配優先 (防止 Apple 誤判)
    let match = merchantDB.find(m => m.name.toLowerCase() === input);
    // 2. 單獨單詞匹配 (防止 MTR 誤判 Pop Mart)
    if (!match) {
        match = merchantDB.find(m => {
            const tokens = m.name.toLowerCase().split(/[\s()]+/);
            return tokens.includes(input);
        });
    }
    // 3. 包含匹配
    if (!match) match = merchantDB.find(m => m.name.toLowerCase().includes(input));

    if (match) {
        document.getElementById('matchHint').innerText = `✅ 自動識別: ${match.name}`;
        document.getElementById('category').value = match.cat;
        updateMethod(match.meth);
    }
}

function analyze() {
    const spent = parseFloat(document.getElementById('currentSpent').value) || 0;
    const amt = parseFloat(document.getElementById('amount').value);
    const cat = document.getElementById('category').value;
    const raw = document.getElementById('merchantSearch').value.trim().toLowerCase();
    if (!amt) return alert("請輸入金額");

    const isMet = (spent + amt) >= 5000;
    let match = merchantDB.find(m => m.name.toLowerCase() === raw) || merchantDB.find(m => m.name.toLowerCase().includes(raw));
    const sub = match ? match.sub : null;
    const today = new Date();

    let processed = cards.filter(c => cardStatus[c.id]).map(c => {
        let baseRes = c.logic(amt, cat, globalMethod, isMet, sub);
        let extraCash = 0, crazyBonus = 0, activePromos = [], promoRemarks = [];

        // 狂賞派邏輯修正 ( Cheers, Sogo, Go )
        const crazyCats = ['Dining','Electronics','Pet','Leisure','Medical','Travel','Jewelry'];
        if (['cheers', 'sogo', 'go'].includes(c.id) && (crazyCats.includes(cat) || (sub && sub.includes("BOC")))) {
            if (globalMethod === 'ApplePay') { if (amt >= 500 && isMet) crazyBonus = isRedDay ? Math.min(amt * 0.05, 300) : Math.min(amt * 0.02, 120); }
            else if (globalMethod === 'Online' && isMet) { crazyBonus = isRedDay ? Math.min(amt * 0.05, 200) : Math.min(amt * 0.02, 60); }
            if (crazyBonus > 0) activePromos.push("狂賞派");
        }

        PROMOTION_HUB.forEach(p => { if (p.keywords.some(k => raw.includes(k.toLowerCase())) && today >= new Date(p.startDate) && today <= new Date(p.endDate) && p.bank === c.bank && amt >= p.minAmt) { extraCash += p.bonusFunc(amt, isRedDay); activePromos.push(p.name); if (p.remarks) promoRemarks.push(p.remarks); } });
        return { ...c, baseRes, extraCash, crazyBonus, activePromos, promoRemarks };
    });

    render(processed);
}

function render(data) {
    document.getElementById('results').style.display = 'block';
    const mc = document.getElementById('miles-results'); mc.innerHTML = '';
    const cc = document.getElementById('cash-results'); cc.innerHTML = '';

    data.filter(c => c.type === 'miles' || c.type === 'both').sort((a,b) => b.baseRes.miles - a.baseRes.miles).forEach(c => { mc.innerHTML += createHtml(c, true); });
    
    // 現金排序修正：基礎+插件+狂賞 總和對比
    data.filter(c => c.type === 'cash' || c.type === 'both').sort((a,b) => {
        const totalA = a.baseRes.val + a.extraCash + a.crazyBonus;
        const totalB = b.baseRes.val + b.extraCash + b.crazyBonus;
        return totalB - totalA;
    }).forEach(c => { cc.innerHTML += createHtml(c, false); });
}

function createHtml(c, isMile) {
    const total = (c.baseRes.val + c.extraCash + c.crazyBonus).toFixed(1);
    return `<div class="card-box ${c.bank}-card">
        <div class="card-top">
            <div class="card-name">${c.name}${c.activePromos.map(p=>`<br><span class="promo-tag">🔥 ${p}</span>`).join('')}</div>
            <div class="earn-val" style="color:${isMile?'var(--miles)':'var(--cash)'}">${isMile ? c.baseRes.miles + ' 里' : '$' + total}${isMile && (c.extraCash+c.crazyBonus)>0 ? `<div style="font-size:11px;color:orange">+$${(c.extraCash+c.crazyBonus).toFixed(0)}</div>`:''}</div>
        </div>
        <div class="card-desc">基礎: ${c.baseRes.rate} ${c.promoRemarks.map(r=>`<br><span class="remark-tip">${r}</span>`).join('')}</div>
    </div>`;
}

function initManager() {
    const saved = localStorage.getItem('軍師卡片狀態_V49');
    if (saved) cardStatus = JSON.parse(saved);
    else cards.forEach(c => cardStatus[c.id] = true);
    const bankOrder = { hsbc: "匯豐", boc: "中銀", hangseng: "恒生", sc: "渣打", citic: "中信", ccb: "建行", mox: "Mox", aeon: "AEON" };
    const container = document.getElementById('bankGroupsContainer'); container.innerHTML = "";
    Object.keys(bankOrder).forEach(bankId => {
        const bankCards = cards.filter(c => c.bank === bankId);
        if (bankCards.length > 0) {
            const groupDiv = document.createElement('div'); groupDiv.className = 'bank-group';
            groupDiv.innerHTML = `<div class="bank-name-label">${bankOrder[bankId]}</div><div class="toggle-grid"></div>`;
            bankCards.forEach(c => {
                const btn = document.createElement('button'); btn.innerText = c.name;
                btn.className = `toggle-card-btn ${bankId} ${cardStatus[c.id] ? 'active' : ''}`;
                btn.onclick = () => { cardStatus[c.id] = !cardStatus[c.id]; btn.classList.toggle('active'); localStorage.setItem('軍師卡片狀態_V49', JSON.stringify(cardStatus)); };
                groupDiv.querySelector('.toggle-grid').appendChild(btn);
            });
            container.appendChild(groupDiv);
        }
    });
}
function toggleManager() { const p = document.getElementById('cardManagerPanel'); p.style.display = (p.style.display === 'block') ? 'none' : 'block'; }
</script>
</body>
</html>
