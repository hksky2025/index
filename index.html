<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能簽賬軍師 V26.0 - 2026 全能版</title>
    <style>
        :root { --primary-miles: #004a99; --primary-cash: #d91d2b; --promo-color: #e65100; --bg-color: #f4f6f9; --card-bg: #ffffff; --text-main: #1a1a1a; --text-sub: #65676b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); margin: 0; padding: 10px; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        header { text-align: center; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 24px; font-weight: 800; color: #1a1a1a; letter-spacing: -0.5px; }
        p.subtitle { margin: 5px 0 0; color: var(--text-sub); font-size: 13px; }
        
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 8px; font-weight: 700; font-size: 14px; color: #333; }
        select, input[type="number"] { width: 100%; padding: 14px; border: 1.5px solid #e0e0e0; border-radius: 12px; font-size: 16px; background: #fff; box-sizing: border-box; transition: border-color 0.2s; }
        select:focus, input:focus { border-color: #0066cc; outline: none; }

        .toggle-container { display: flex; gap: 8px; background: #ebeef2; padding: 4px; border-radius: 12px; }
        .toggle-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; text-align: center; font-size: 13px; font-weight: 700; color: var(--text-sub); transition: all 0.2s; }
        .toggle-btn.active { background-color: #fff; color: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .promo-btn.active { background-color: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }

        .analyze-btn { width: 100%; padding: 16px; background: #1a1a1a; color: white; border: none; border-radius: 14px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .analyze-btn:hover { background: #333; }

        .results-area { margin-top: 30px; display: none; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 8px; border-bottom: 2px solid #eee; }
        .section-title { font-size: 17px; font-weight: 800; }
        .miles-header { color: var(--primary-miles); }
        .cash-header { color: var(--primary-cash); margin-top: 30px; }
        
        .card-box { background: #fff; border: 1px solid #eee; border-radius: 16px; padding: 18px; margin-bottom: 15px; position: relative; border-left: 6px solid #ccc; }
        .card-box.miles-card { border-left-color: var(--primary-miles); background: linear-gradient(to right, #f0f7ff, #fff); }
        .card-box.cash-card { border-left-color: var(--primary-cash); background: linear-gradient(to right, #fff5f5, #fff); }
        .card-box.combo-card { border-left-color: #ff9800; background: linear-gradient(to right, #fffaf0, #fff); }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-name { font-weight: 800; font-size: 16px; color: #1a1a1a; }
        .earn-value { font-size: 20px; font-weight: 900; text-align: right; }
        .miles-text { color: var(--primary-miles); }
        .cash-text { color: var(--primary-cash); }
        
        .card-calc { font-size: 12.5px; color: #555; margin-top: 10px; line-height: 1.5; padding-top: 8px; border-top: 1px dashed #ddd; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag { font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 700; }
        .tag-blue { background: #e3f2fd; color: #1565c0; }
        .tag-orange { background: #fff3e0; color: #e65100; }
        .tag-warn { background: #ffebee; color: #c62828; }
        
        .note { font-size: 12px; color: #888; text-align: center; margin-top: 30px; line-height: 1.6; }
        .reset-link { cursor: pointer; color: #0066cc; text-decoration: underline; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💳 智能簽賬軍師 V26.0</h1>
        <p class="subtitle">2026 最新版：Mox 1% / BoC 狂賞派 / $3里 Eye 卡</p>
        <span class="reset-link" onclick="location.reload()">↺ 重置所有數據</span>
    </header>

    <div class="input-group">
        <label>當月累積簽賬狀態</label>
        <div class="toggle-container" id="threshold-container">
            <button class="toggle-btn active" onclick="setThreshold(false, this)">未滿 $5,000</button>
            <button class="toggle-btn" onclick="setThreshold(true, this)">已滿 $5,000 👑</button>
        </div>
    </div>

    <div class="input-group">
        <label>推廣優惠 (BoC 狂賞派 2026)</label>
        <div class="toggle-container" id="promo-container">
            <button class="toggle-btn active" onclick="setPromo(false, this)">一般消費</button>
            <button class="toggle-btn promo-btn" onclick="setPromo(true, this)">🔥 疊加狂賞派</button>
        </div>
        <div id="day-selector" style="display:none; margin-top:10px;">
            <div class="toggle-container">
                <button class="toggle-btn active" onclick="setDay('Weekday', this)">平日 (+2%)</button>
                <button class="toggle-btn" onclick="setDay('RedDay', this)" style="color:red;">驚喜紅日 (+5%)</button>
            </div>
        </div>
    </div>

    <div class="input-group">
        <label>消費類別</label>
        <select id="categorySelect" onchange="autoSetMethod()">
            <option value="General">-- 一般本地消費 --</option>
            <optgroup label="🛍️ 網購 / 電子產品">
                <option value="Online_General">網上購物 (淘寶/HKTV/Amazon)</option>
                <option value="Elec_Online">網上電子產品 (Apple/豐澤網店)</option>
                <option value="Elec_Physical">實體電子產品 (豐澤/百老匯)</option>
            </optgroup>
            <optgroup label="🍽️ 餐飲食肆">
                <option value="Dining_Local">本地餐廳實體店</option>
                <option value="Dining_Online">網上外賣 (Keeta/Foodpanda)</option>
            </optgroup>
            <optgroup label="🛒 超市 / 護理">
                <option value="Shop_Supermarket">超市 (惠康/百佳/M&S)</option>
                <option value="Shop_PersonalCare">護理 (萬寧/屈臣氏)</option>
            </optgroup>
            <optgroup label="✈️ 旅遊 / 外幣">
                <option value="Overseas_Physical">海外實體店 (外幣簽賬)</option>
                <option value="Travel_Airline">航空公司官網 (國泰/UO)</option>
                <option value="Travel_OTA">酒店平台 (Trip.com/Agoda)</option>
            </optgroup>
        </select>
    </div>

    <div class="input-group">
        <label>簽賬金額 (HKD)</label>
        <input type="number" id="amount" placeholder="輸入金額" inputmode="numeric">
    </div>

    <div class="input-group">
        <label>支付方式</label>
        <div class="toggle-container" id="method-container">
            <button class="toggle-btn active" onclick="setMethod('ApplePay', this)">手機支付 (Apple/Google)</button>
            <button class="toggle-btn" onclick="setMethod('Online', this)">網上輸入卡號</button>
            <button class="toggle-btn" onclick="setMethod('Physical', this)">實體插卡</button>
        </div>
    </div>

    <button class="analyze-btn" onclick="analyze()">立即計算最佳回報</button>

    <div id="results" class="results-area">
        <div class="section-header miles-header"><div class="section-title">✈️ 里數優先 (折算價值)</div></div>
        <div id="miles-list"></div>
        <div class="section-header cash-header"><div class="section-title">💰 現金回贈 / 安全之選</div></div>
        <div id="cash-list"></div>
    </div>
    
    <div class="note">
        * 註：里數價值按 $0.06/里 估算。<br>
        * Mox 回贈以「基本客戶」1% 計算。中銀狂賞派需單筆滿 $500 及當月滿 $5,000。
    </div>
</div>

<script>
    let thresholdMet = false;
    let promoActive = false;
    let dayType = 'Weekday';
    let method = 'ApplePay';
    let currency = 'HKD';

    function setThreshold(val, btn) { thresholdMet = val; toggleActive(btn); }
    function setPromo(val, btn) { 
        promoActive = val; 
        toggleActive(btn); 
        document.getElementById('day-selector').style.display = val ? 'block' : 'none';
    }
    function setDay(val, btn) { dayType = val; toggleActive(btn); }
    function setMethod(val, btn) { method = val; toggleActive(btn); }

    function toggleActive(btn) {
        const container = btn.closest('.toggle-container');
        container.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    function autoSetMethod() {
        const cat = document.getElementById('categorySelect').value;
        const btns = document.querySelectorAll('#method-container .toggle-btn');
        if (cat.includes('Online') || cat.includes('OTA') || cat === 'Travel_Airline') {
            btns[1].click(); // 自動選網上
        } else if (cat === 'Overseas_Physical' || cat.includes('Dining') || cat.includes('Shop')) {
            btns[0].click(); // 自動選手機支付
        }
    }

    const myCards = [
        { id: 'waku', name: 'Aeon Wakuwaku', type: 'cash',
          logic: (amt, cat, meth) => {
            if (meth === 'Online' || cat.includes('Online')) {
                const limit = 5000; // 2026 網購上限
                if (amt > limit) return { val: (limit * 0.06) + (amt - limit) * 0.005, rateText: '混合', desc: '首$5000享6%, 後0.5%', warning: true };
                return { val: amt * 0.06, rateText: '6.0%', desc: '網購無門檻 6%', tag: '網購首選' };
            }
            return { val: amt * 0.005, rateText: '0.5%', desc: '基本 0.5%' };
          }
        },
        { id: 'mmpower', name: '恒生 MMPOWER', type: 'cash',
          logic: (amt, cat, meth) => {
            if (!thresholdMet) return { val: amt * 0.004, rateText: '0.4%', desc: '⚠️ 未滿$5k總簽賬門檻', warning: true };
            const isTarget = meth === 'Online' || cat.includes('Online') || cat === 'Overseas_Physical';
            if (isTarget) {
                const limit = 10870;
                if (amt > limit) return { val: (limit * 0.05) + (amt - limit) * 0.004, rateText: '5%爆額', desc: '首$10870享5%', warning: true };
                return { val: amt * 0.05, rateText: '5.0%', desc: '網購/外幣 5%' };
            }
            return { val: amt * 0.01, rateText: '1.0%', desc: '自選類別/基本' };
          }
        },
        { id: 'red', name: 'HSBC Red', type: 'cash',
          logic: (amt, cat, meth) => {
            if (meth === 'Online' || cat.includes('Online')) {
                if (amt > 10000) return { val: (10000 * 0.04) + (amt - 10000) * 0.01, rateText: '4%爆額', desc: '首萬4%, 後1%', warning: true };
                return { val: amt * 0.04, rateText: '4.0%', desc: '網購無門檻 4%' };
            }
            return { val: amt * 0.01, rateText: '1.0%', desc: '超市/基本 1%' };
          }
        },
        { id: 'mox', name: 'Mox Credit', type: 'cash',
          logic: (amt, cat, meth) => {
            const is3Percent = cat.includes('Shop_');
            if (is3Percent) {
                const capLimit = 2500; // 額外2%上限$50
                if (amt > capLimit) return { val: (capLimit * 0.03) + (amt - capLimit) * 0.01, rateText: '3%爆額', desc: '首$2500享3%, 後1%', warning: true };
                return { val: amt * 0.03, rateText: '3.0%', desc: '指定超市/護理 3%' };
            }
            return { val: amt * 0.01, rateText: '1.0%', desc: '基本 1% (基本客戶)', tag: '基本1%' };
          }
        },
        { id: 'eye', name: 'CCB Eye', type: 'miles', 
          logic: (amt, cat, meth) => {
            if (meth === 'ApplePay' || meth === 'Online') {
                return { type: 'miles', val: Math.floor((amt * 5) / 15), rateText: '$3/里', desc: '網購/手機 5X (約2%回贈)', tag: '網購手機' };
            }
            return { type: 'miles', val: Math.floor(amt / 15), rateText: '$15/里', desc: '基本 1X' };
          }
        },
        { id: 'cheers', name: '中銀 Cheers VI', type: 'miles',
          logic: (amt, cat, meth) => {
            const isEligible = cat.includes('Dining') || cat === 'Overseas_Physical';
            if (isEligible && thresholdMet) {
                return { type: 'miles', val: Math.floor(amt / 1.5), rateText: '$1.5/里', desc: '餐飲/外幣 10X (約4%回贈)', tag: '神卡' };
            }
            return { type: 'miles', val: Math.floor(amt / 15), rateText: '$15/里', desc: thresholdMet ? '基本' : '⚠️ 總簽賬未滿$5k' };
          }
        },
        { id: 'sogo', name: '中銀 Sogo Visa', type: 'cash',
          logic: (amt, cat, meth) => {
            if (meth === 'ApplePay') {
                if (amt > 2000) return { val: (2000 * 0.054) + (amt-2000) * 0.004, rateText: '5.4%爆額', desc: '首$2k手機支付 5.4%', warning: true };
                return { val: amt * 0.054, rateText: '5.4%', desc: '手機支付 5.4%', tag: '最快回贈' };
            }
            return { val: amt * 0.004, rateText: '0.4%', desc: '基本' };
          }
        }
    ];

    function calculatePromoReward(cardId, amount) {
        if (!promoActive || !thresholdMet || amount < 500) return 0;
        const bocCards = ['cheers', 'sogo', 'boc_go'];
        if (bocCards.includes(cardId)) {
            const rate = dayType === 'RedDay' ? 0.05 : 0.02;
            return amount * rate;
        }
        return 0;
    }

    function analyze() {
        const amount = parseFloat(document.getElementById('amount').value);
        const category = document.getElementById('categorySelect').value;
        if (!amount) return alert('請輸入簽賬金額');

        let results = myCards.map(card => {
            const base = card.logic(amount, category, method);
            const promoVal = calculatePromoReward(card.id, amount);
            
            let milesCashEquiv = (base.type === 'miles' ? base.val * 0.06 : 0);
            let cashVal = (base.type === 'cash' ? base.val : 0);
            let totalScore = milesCashEquiv + cashVal + promoVal;

            return { ...card, baseResult: base, promoVal, totalScore };
        });

        results.sort((a, b) => b.totalScore - a.totalScore);
        render(results);
    }

    function render(results) {
        const milesList = document.getElementById('miles-list');
        const cashList = document.getElementById('cash-list');
        milesList.innerHTML = ''; cashList.innerHTML = '';

        results.forEach((item) => {
            const isCombo = item.promoVal > 0;
            const cardClass = isCombo ? 'combo-card' : (item.type === 'miles' ? 'miles-card' : 'cash-card');
            const totalDisplay = item.type === 'miles' 
                ? `${item.baseResult.val} 里 ${isCombo ? '+ $'+item.promoVal.toFixed(0) : ''}`
                : `$${(item.baseResult.val + item.promoVal).toFixed(1)}`;

            const html = `
                <div class="card-box ${cardClass}">
                    <div class="card-top">
                        <span class="card-name">${item.name}</span>
                        <div class="earn-value ${item.type === 'miles' ? 'miles-text' : 'cash-text'}">${totalDisplay}</div>
                    </div>
                    <div class="tags">
                        <span class="tag tag-blue">${item.baseResult.rateText}</span>
                        ${isCombo ? '<span class="tag tag-orange">2026 狂賞派中</span>' : ''}
                        ${item.baseResult.warning ? '<span class="tag tag-warn">注意上限</span>' : ''}
                        ${item.baseResult.tag ? `<span class="tag tag-blue">${item.baseResult.tag}</span>` : ''}
                    </div>
                    <div class="card-calc">${item.baseResult.desc}${isCombo ? '<br><b>+ 狂賞派額外獎賞</b>' : ''}</div>
                </div>`;
            
            if (item.type === 'miles') milesList.innerHTML += html;
            else cashList.innerHTML += html;
        });

        document.getElementById('results').style.display = 'block';
    }
</script>

</body>
</html>
