<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能簽賬軍師 V27.0 - 2026 精確運算版</title>
    <style>
        :root { --boc: #b31d28; --hsbc: #db0011; --hangseng: #008154; --primary-miles: #004a99; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; margin: 0; padding: 10px; color: #1a1a1a; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 13px; }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 15px; box-sizing: border-box; }
        .toggle-container { display: flex; gap: 5px; background: #eee; padding: 4px; border-radius: 10px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 700; color: #666; background: none; }
        .toggle-btn.active { background: #fff; color: #000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .analyze-btn { width: 100%; padding: 16px; background: #000; color: #fff; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .card-box { border: 1px solid #eee; border-radius: 15px; padding: 15px; margin-bottom: 10px; border-left: 5px solid #ccc; }
        .boc-card { border-left-color: var(--boc); background: #fff9f9; }
        .hsbc-card { border-left-color: var(--hsbc); background: #fffafa; }
        .hangseng-card { border-left-color: var(--hangseng); background: #f7fffb; }
        .miles-card { border-left-color: var(--primary-miles); background: #f9fbff; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-name { font-weight: 800; font-size: 15px; }
        .earn-val { font-size: 18px; font-weight: 900; text-align: right; }
        .sub-text { font-size: 11px; color: #d32f2f; font-weight: bold; }
        .card-desc { font-size: 12px; color: #666; margin-top: 8px; border-top: 1px dashed #ddd; padding-top: 8px; }
        .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #eee; margin-right: 4px; font-weight: 700; }
        .highlight { color: #e65100; font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin-top:0;">💳 智能簽賬軍師 V27.0</h2>

    <div class="input-group">
        <label>當月已簽總額 (HKD)</label>
        <input type="number" id="currentSpent" value="0">
    </div>

    <div class="input-group">
        <label>本次簽賬金額 (HKD)</label>
        <input type="number" id="amount" placeholder="輸入金額" inputmode="numeric">
    </div>

    <div class="input-group">
        <label>消費日期</label>
        <div class="toggle-container">
            <button class="toggle-btn active" onclick="setDay(false, this)">平日 (額外+2%)</button>
            <button class="toggle-btn" onclick="setDay(true, this)" style="color:#d32f2f">紅日 (額外+5%)</button>
        </div>
    </div>

    <div class="input-group">
        <label>支付方式</label>
        <div class="toggle-container">
            <button class="toggle-btn active" onclick="setMethod('ApplePay', this)">手機支付(實體店)</button>
            <button class="toggle-btn" onclick="setMethod('Online', this)">網上簽賬/App內</button>
            <button class="toggle-btn" onclick="setMethod('Physical', this)">實體插卡</button>
        </div>
    </div>

    <div class="input-group">
        <label>詳細類別</label>
        <select id="category">
            <option value="General">-- 一般本地消費 --</option>
            <option value="Red8">🔴 Red指定8% (壽司郎/譚仔/GU/lululemon/NAMCO)</option>
            <option value="Dining">🍽️ 餐飲食肆 (包含快餐/OpenRice)</option>
            <option value="Electronics">🔌 電子產品 (Apple門市/豐澤/百老滙/友和)</option>
            <option value="Home">🏠 家居/電訊 (日本城/宜家/csl/3HK/Simmons)</option>
            <option value="Super">🛒 超市 (Donki/阿信屋/百佳/759)</option>
            <option value="Transport">🚌 交通出行 (港鐵/巴士/隧道/油站)</option>
            <option value="Coffee">☕ 咖啡輕食 (%Arabica/Starbucks/天仁)</option>
            <option value="Medical">🏥 醫療服務 (醫院/體檢中心)</option>
            <option value="Travel">✈️ 旅遊機票 (旅行社/Klook/酒店)</option>
            <option value="Overseas">🌍 海外外幣 (Cheers 10X / MMPOWER 6%)</option>
        </select>
    </div>

    <button class="analyze-btn" onclick="analyze()">精確運算最優組合</button>

    <div id="results" style="margin-top:20px; display:none;">
        <div id="list-container"></div>
    </div>
</div>

<script>
    let isRedDay = false;
    let method = 'ApplePay';

    function setDay(v, b) { isRedDay = v; toggleActive(b); }
    function setMethod(m, b) { method = m; toggleActive(b); }
    function toggleActive(b) {
        b.closest('.toggle-container').querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
    }

    const cards = [
        { name: '中銀 Cheers VI', bank: 'boc', type: 'miles', logic: (amt, cat, meth, isMet) => {
            let pts = (cat === 'Dining' || cat === 'Overseas') && isMet ? amt * 10 : amt;
            let miles = (cat === 'Dining' || cat === 'Overseas') && isMet ? amt / 1.5 : amt / 15;
            let cashBase = (cat === 'Dining' || cat === 'Overseas') && isMet ? amt * 0.04 : amt * 0.004;
            return { val: cashBase, miles: Math.floor(miles), desc: `Cheers 10X: ${(cat === 'Dining' || cat === 'Overseas') && isMet ? '$1.5/里 (4%)' : '$15/里 (0.4%)'}` };
        }},
        { name: '恒生 MMPOWER', bank: 'hangseng', type: 'cash', logic: (amt, cat, meth, isMet) => {
            if (!isMet) return { val: amt * 0.004, desc: '未滿$5,000門檻 (僅0.4%)' };
            if (cat === 'Overseas') return { val: Math.min(amt * 0.06, 500 + amt*0.004), desc: '海外 6% (額外上限$500)' };
            if (meth === 'Online' || cat === 'Travel') return { val: Math.min(amt * 0.05, 500 + amt*0.004), desc: '網上零售 5% (含App內餐飲)' };
            if (cat === 'Dining' || cat === 'Electronics') return { val: amt * 0.01, desc: '自選類別 1% (實體簽賬)' };
            return { val: amt * 0.004, desc: '基本 0.4%' };
        }},
        { name: 'HSBC Red', bank: 'hsbc', type: 'cash', logic: (amt, cat, meth) => {
            if (cat === 'Red8') return { val: amt * 0.08, desc: '指定商戶 8% 獎賞錢' };
            if (meth === 'Online' || cat === 'Travel') return amt <= 10000 ? { val: amt * 0.04, desc: '網購 4%' } : { val: 400 + (amt-10000)*0.01, desc: '網購(萬後1%)' };
            return { val: amt * 0.01, desc: '基本/超市 1%' };
        }},
        { name: 'HSBC EveryMile', bank: 'hsbc', type: 'miles', logic: (amt, cat) => {
            if (cat === 'Transport' || cat === 'Coffee') return { val: amt * 0.025, miles: Math.floor(amt/2), desc: '指定交通/咖啡 $2/里 (2.5%)' };
            if (cat === 'Overseas') return { val: amt * 0.025, miles: Math.floor(amt/2), desc: '外幣 $2/里 (2.5%)' };
            return { val: amt * 0.01, miles: Math.floor(amt/5), desc: '基本 $5/里 (1%)' };
        }},
        { name: 'HSBC VS (賞家居)', bank: 'hsbc', type: 'cash', logic: (amt, cat) => {
            const isHome = ['Home','Electronics','Super'].includes(cat);
            return { val: isHome ? amt * 0.036 : amt * 0.004, desc: isHome ? '「賞家居」3.6% (含Donki/宜家/電訊)' : '基本 0.4%' };
        }},
        { name: '渣打國泰卡', bank: 'miles', type: 'miles', logic: (amt, cat) => {
            let rate = (cat === 'Dining' || cat === 'Travel' || cat === 'Overseas') ? 4 : 6;
            return { val: amt * (0.1/rate), miles: Math.floor(amt/rate), desc: `食肆/旅遊/外幣 $${rate}/里` };
        }},
        { name: 'Aeon Wakuwaku', bank: 'cash', type: 'cash', logic: (amt, cat, meth) => {
            if (meth === 'Online') return amt <= 3571 ? { val: amt * 0.06, desc: '網購 6%' } : { val: 214.3 + (amt-3571)*0.005, desc: '網購(爆額後0.5%)' };
            return { val: amt * 0.005, desc: '基本 0.5%' };
        }}
    ];

    function analyze() {
        const spent = parseFloat(document.getElementById('currentSpent').value) || 0;
        const amt = parseFloat(document.getElementById('amount').value);
        const cat = document.getElementById('category').value;
        if (!amt) return;

        const isMet = (spent + amt) >= 5000;
        const crazyCats = ['Dining','Electronics','Medical','Travel','Red8'];
        const isCrazyCat = crazyCats.includes(cat);

        let results = cards.map(c => {
            let res = c.logic(amt, cat, method, isMet);
            let promoCash = 0;
            let promoDesc = "";

            // 中銀狂賞派邏輯
            if (c.bank === 'boc' || (isCrazyCat && amt >= 500 && isMet)) {
                // 如果是中銀信用卡
                const isOnline = (method === 'Online');
                if (isOnline) {
                    promoCash = isRedDay ? Math.min(amt * 0.05, 200) : Math.min(amt * 0.02, 60);
                    promoDesc = `狂賞網購(+${isRedDay?5:2}%)`;
                } else {
                    promoCash = isRedDay ? Math.min(amt * 0.05, 300) : Math.min(amt * 0.02, 120);
                    promoDesc = `狂賞實體(+${isRedDay?5:2}%)`;
                }
            }
            
            // 綜合評分 (里數按 1里 = $0.1 計算)
            let totalCashValue = res.val + promoCash;
            return { ...c, total: totalCashValue, promo: promoCash, pDesc: promoDesc, base: res };
        }).sort((a, b) => b.total - a.total);

        render(results, amt);
    }

    function render(results, amt) {
        const container = document.getElementById('list-container');
        container.innerHTML = "";
        
        results.forEach(res => {
            let earnDisplay = res.type === 'miles' ? `${res.base.miles} 里` : `$${res.total.toFixed(1)}`;
            let promoDisplay = res.promo > 0 ? `<div class="sub-text">+ $${res.promo.toFixed(1)} (${res.pDesc})</div>` : "";
            
            container.innerHTML += `
                <div class="card-box ${res.bank}-card ${res.type==='miles'?'miles-card':''}">
                    <div class="card-header">
                        <div>
                            <span class="card-name">${res.name}</span>
                            ${res.promo > 0 ? '<span class="tag" style="background:#fff3e0; color:#e65100;">狂賞派激活</span>' : ''}
                        </div>
                        <div class="earn-val" style="color:${res.type==='miles'?'#004a99':'#d32f2f'}">
                            ${earnDisplay}
                            ${promoDisplay}
                        </div>
                    </div>
                    <div class="card-desc">
                        ${res.base.desc}
                        ${amt < 500 && (res.bank === 'boc') ? '<br><span style="color:red">! 單筆未滿$500，無狂賞派回贈</span>' : ''}
                    </div>
                </div>
            `;
        });
        document.getElementById('results').style.display = 'block';
    }
</script>
</body>
</html>
