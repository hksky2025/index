<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能簽賬軍師 V27.2 - 2026 分類排序版</title>
    <style>
        :root { --boc: #b31d28; --hsbc: #db0011; --hangseng: #008154; --miles-blue: #004a99; --cash-red: #d32f2f; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8f9fa; margin: 0; padding: 10px; color: #1a1a1a; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
        .info-box { background: #e3f2fd; border: 1px solid #bbdefb; padding: 12px; border-radius: 12px; font-size: 12px; color: #1565c0; margin-bottom: 20px; line-height: 1.5; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 13px; color: #555; }
        select, input { width: 100%; padding: 12px; border: 1.5px solid #eee; border-radius: 12px; font-size: 15px; box-sizing: border-box; }
        .toggle-container { display: flex; gap: 5px; background: #f0f0f0; padding: 4px; border-radius: 12px; }
        .toggle-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; font-size: 12px; font-weight: 700; color: #666; background: none; }
        .toggle-btn.active { background: #fff; color: #000; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .analyze-btn { width: 100%; padding: 18px; background: #1a1a1a; color: #fff; border: none; border-radius: 15px; font-size: 18px; font-weight: 800; cursor: pointer; margin-top: 10px; }
        
        /* 結果分組樣式 */
        .section-header { margin-top: 25px; padding-bottom: 8px; border-bottom: 2px solid #eee; font-size: 17px; font-weight: 800; display: flex; align-items: center; }
        .section-header.miles { color: var(--miles-blue); }
        .section-header.cash { color: var(--cash-red); }
        
        .card-box { border: 1px solid #f0f0f0; border-radius: 18px; padding: 15px; margin-top: 12px; border-left: 6px solid #ccc; background: #fff; position: relative; }
        .boc-card { border-left-color: var(--boc); }
        .hsbc-card { border-left-color: var(--hsbc); }
        .hangseng-card { border-left-color: var(--hangseng); }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
        .card-name { font-weight: 800; font-size: 15px; }
        .earn-val { font-size: 20px; font-weight: 900; text-align: right; }
        .promo-tag { background: #fff3e0; color: #e65100; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; display: inline-block; margin-top: 4px; }
        .card-desc { font-size: 12px; color: #777; margin-top: 10px; border-top: 1px dashed #eee; padding-top: 8px; line-height: 1.4; }
        .warn-msg { color: #d32f2f; font-weight: 700; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; margin-top:0;">💳 智能簽賬軍師 V27.2</h2>

    <div class="info-box">
        <strong>📌 當月已簽總額的影響：</strong><br>
        • <strong>激活獎賞：</strong> 當（已簽額 + 此單）≥ <b>$5,000</b> 時，系統會自動激活 <u>中銀狂賞派額外回贈</u> 及 <u>恒生 MMPOWER 高倍率</u>。
    </div>

    <div class="input-group">
        <label>當月累計簽賬 (HKD)</label>
        <input type="number" id="currentSpent" value="0" placeholder="之前已簽的金額">
    </div>

    <div class="input-group">
        <label>本次簽賬金額 (HKD)</label>
        <input type="number" id="amount" placeholder="輸入金額" inputmode="numeric">
    </div>

    <div class="input-group">
        <label>消費時段 (狂賞派加乘條件)</label>
        <div class="toggle-container">
            <button class="toggle-btn active" onclick="setDay(false, this)">平日 (Mon-Fri)</button>
            <button class="toggle-btn" onclick="setDay(true, this)" style="color:#d32f2f">紅日/週末 (Sat-Sun)</button>
        </div>
    </div>

    <div class="input-group">
        <label>支付方式</label>
        <div class="toggle-container">
            <button class="toggle-btn active" onclick="setMethod('ApplePay', this)">手機支付(實體店)</button>
            <button class="toggle-btn" onclick="setMethod('Online', this)">網上/App內支付</button>
            <button class="toggle-btn" onclick="setMethod('Physical', this)">實體插卡/銀聯</button>
        </div>
    </div>

    <div class="input-group">
        <label>消費類別</label>
        <select id="category">
            <option value="General">-- 一般本地消費 --</option>
            <option value="Red8">🔴 Red指定8% (壽司郎/GU/lululemon等)</option>
            <option value="Dining">🍽️ 餐飲食肆 (狂賞/MMPOWER自選)</option>
            <option value="Electronics">🔌 電子產品 (Apple/豐澤/百老滙/友和)</option>
            <option value="Home">🏠 家居用品/電訊 (日本城/宜家/csl)</option>
            <option value="Super">🛒 超市 (Donki/阿信屋/百佳)</option>
            <option value="Transport">🚌 交通出行 (港鐵/巴士/隧道/油站)</option>
            <option value="Coffee">☕ 咖啡輕食 (Starbucks/Arabica/天仁)</option>
            <option value="Medical">🏥 醫療服務 (醫院/診所/體檢)</option>
            <option value="Travel">✈️ 旅遊機票 (Klook/航空/酒店)</option>
            <option value="Overseas">🌍 海外外幣 (Cheers/MMPOWER)</option>
        </select>
    </div>

    <button class="analyze-btn" onclick="analyze()">精確運算最佳分組</button>

    <div id="results" style="display:none;">
        <div class="section-header miles">✈️ 里數優先建議 (高至低)</div>
        <div id="miles-results"></div>
        
        <div class="section-header cash">💰 現金回贈建議 (高至低)</div>
        <div id="cash-results"></div>
    </div>
</div>

<script>
    let isRedDay = false;
    let method = 'ApplePay';

    function setDay(v, b) { isRedDay = v; toggleActive(b); }
    function setMethod(m, b) { method = m; toggleActive(b); }
    function toggleActive(b) {
        b.closest('.toggle-container').querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
        b.classList.add('active');
    }

    const cards = [
        // --- 里數組 ---
        { id: 'cheers', name: '中銀 Cheers VI', bank: 'boc', type: 'miles', logic: (amt, cat, meth, isMet) => {
            let isTarget = (cat === 'Dining' || cat === 'Overseas') && isMet;
            return { val: isTarget ? amt * 0.04 : amt * 0.004, miles: Math.floor(amt / (isTarget ? 1.5 : 15)), rate: isTarget ? '$1.5/里' : '$15/里' };
        }},
        { id: 'everymile', name: 'HSBC EveryMile', bank: 'hsbc', type: 'miles', logic: (amt, cat) => {
            let isTarget = ['Transport', 'Coffee', 'Overseas'].includes(cat);
            return { val: isTarget ? amt * 0.025 : amt * 0.01, miles: isTarget ? Math.floor(amt/2) : Math.floor(amt/5), rate: isTarget ? '$2/里' : '$5/里' };
        }},
        { id: 'cathay', name: '渣打國泰卡', bank: 'sc', type: 'miles', logic: (amt, cat) => {
            let r = (['Dining','Travel','Overseas'].includes(cat)) ? 4 : 6;
            return { val: amt * (0.1/r), miles: Math.floor(amt/r), rate: `$${r}/里` };
        }},
        // --- 回贈組 ---
        { id: 'red', name: 'HSBC Red', bank: 'hsbc', type: 'cash', logic: (amt, cat, meth) => {
            if (cat === 'Red8') return { val: amt * 0.08, rate: '8%' };
            if (meth === 'Online') return amt <= 10000 ? { val: amt * 0.04, rate: '4%' } : { val: 400 + (amt-10000)*0.01, rate: '4% -> 1%' };
            return { val: amt * 0.01, rate: '1%' };
        }},
        { id: 'mmpower', name: '恒生 MMPOWER', bank: 'hangseng', type: 'cash', logic: (amt, cat, meth, isMet) => {
            if (!isMet) return { val: amt * 0.004, rate: '0.4%' };
            if (cat === 'Overseas') return { val: Math.min(amt * 0.06, 500 + amt*0.004), rate: '6%' };
            if (meth === 'Online' || cat === 'Travel') return { val: Math.min(amt * 0.05, 500 + amt*0.004), rate: '5%' };
            if (cat === 'Dining' || cat === 'Electronics') return { val: amt * 0.01, rate: '1%' };
            return { val: amt * 0.004, rate: '0.4%' };
        }},
        { id: 'sogo', name: '中銀 Sogo Visa', bank: 'boc', type: 'cash', logic: (amt, cat, meth) => {
            if (meth === 'ApplePay') return amt <= 2000 ? { val: amt * 0.054, rate: '5.4%' } : { val: 108 + (amt-2000)*0.004, rate: '5.4%上限' };
            return { val: amt * 0.004, rate: '0.4%' };
        }},
        { id: 'go', name: '中銀 Go 銀聯', bank: 'boc', type: 'cash', logic: (amt, cat, meth) => {
            if (cat === 'Super') return { val: amt * 0.05, rate: '5%' };
            return { val: amt * 0.004, rate: '0.4%' };
        }},
        { id: 'vs', name: 'HSBC Visa Signature', bank: 'hsbc', type: 'cash', logic: (amt, cat) => {
            let isHome = ['Home','Electronics','Super'].includes(cat);
            return { val: isHome ? amt * 0.036 : amt * 0.004, rate: isHome ? '3.6%' : '0.4%' };
        }},
        { id: 'waku', name: 'Aeon Wakuwaku', bank: 'aeon', type: 'cash', logic: (amt, cat, meth) => {
            if (meth === 'Online') return amt <= 3571 ? { val: amt * 0.06, rate: '6%' } : { val: 214.3 + (amt-3571)*0.005, rate: '6%上限' };
            return { val: amt * 0.005, rate: '0.5%' };
        }}
    ];

    function analyze() {
        const spent = parseFloat(document.getElementById('currentSpent').value) || 0;
        const amt = parseFloat(document.getElementById('amount').value);
        const cat = document.getElementById('category').value;
        if (!amt) return;

        const isMet = (spent + amt) >= 5000;
        const isCrazyCat = ['Dining','Electronics','Medical','Travel','Red8'].includes(cat);
        const bocPromoCards = ['cheers', 'sogo', 'go'];

        let processedCards = cards.map(c => {
            let res = c.logic(amt, cat, method, isMet);
            let promo = 0;
            let promoDesc = "";

            // 狂賞派加乘 (僅限中銀三張卡)
            if (bocPromoCards.includes(c.id) && isMet && amt >= 500 && isCrazyCat) {
                const isOnline = (method === 'Online');
                if (isOnline) {
                    promo = isRedDay ? Math.min(amt * 0.05, 200) : Math.min(amt * 0.02, 60);
                    promoDesc = `狂賞網購(+${isRedDay?5:2}%)`;
                } else {
                    promo = isRedDay ? Math.min(amt * 0.05, 300) : Math.min(amt * 0.02, 120);
                    promoDesc = `狂賞實體(+${isRedDay?5:2}%)`;
                }
            }
            return { ...c, res, promo, promoDesc };
        });

        // 里數組排序 (按 miles)
        const milesResults = processedCards
            .filter(c => c.type === 'miles')
            .sort((a, b) => b.res.miles - a.res.miles);

        // 回贈組排序 (按總 val + promo)
        const cashResults = processedCards
            .filter(c => c.type === 'cash')
            .sort((a, b) => (b.res.val + b.promo) - (a.res.val + a.promo));

        render(milesResults, cashResults, amt);
    }

    function render(miles, cash, amt) {
        document.getElementById('results').style.display = 'block';
        const milesContainer = document.getElementById('miles-results');
        const cashContainer = document.getElementById('cash-results');
        milesContainer.innerHTML = ''; cashContainer.innerHTML = '';

        miles.forEach(c => {
            milesContainer.innerHTML += createCardHtml(c, amt, true);
        });

        cash.forEach(c => {
            cashContainer.innerHTML += createCardHtml(c, amt, false);
        });
    }

    function createCardHtml(c, amt, isMileType) {
        const totalCash = (c.res.val + c.promo).toFixed(1);
        const valueDisplay = isMileType ? `${c.res.miles} 里` : `$${totalCash}`;
        const bocWarning = (amt < 500 && ['cheers','sogo','go'].includes(c.id)) ? '<div class="warn-msg">! 單筆不足$500 失去狂賞加乘</div>' : '';
        
        return `
            <div class="card-box ${c.bank}-card">
                <div class="card-top">
                    <div>
                        <div class="card-name">${c.name}</div>
                        ${c.promo > 0 ? `<div class="promo-tag">已激活: ${c.promoDesc}</div>` : ''}
                    </div>
                    <div class="earn-val" style="color:${isMileType?'var(--miles-blue)':'var(--cash-red)'}">
                        ${valueDisplay}
                        ${(isMileType && c.promo > 0) ? `<div style="font-size:11px; color:#e65100;">+$${c.promo.toFixed(0)} 現金</div>` : ''}
                    </div>
                </div>
                <div class="card-desc">
                    回贈率: ${c.res.rate} ${bocWarning}
                </div>
            </div>
        `;
    }
</script>
</body>
</html>
